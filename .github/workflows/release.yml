name: Release ShortestPath IDE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release-v* or Beta-v* tag to rebuild'
        required: true
        type: string
  push:
    tags:
      - 'Release-v*'
      - 'Beta-v*'

permissions:
  contents: write

concurrency:
  group: shortestpath-ide-release
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name
        run: |
          case "$RELEASE_TAG" in
            Release-v?*|Beta-v?*) ;;
            *) echo 'Expected a Release-v* or Beta-v* tag.' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}


  build-linux-arm64:
    needs: validate-release
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VSCODE_ARCH: arm64
      npm_config_arch: arm64
      npm_config_foreground_scripts: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev libxss1 libasound2t64

      - name: Install dependencies
        run: |
          npmrc=$(cat .npmrc)
          trap 'printf "%s" "$npmrc" > .npmrc' EXIT
          sed -i '/^build_from_source=/d' .npmrc
          npm ci
          printf "%s" "$npmrc" > .npmrc
          trap - EXIT
          npm rebuild @vscode/policy-watcher @vscode/spdlog @vscode/sqlite3 native-keymap --build-from-source --foreground-scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build bundled OI extensions
        run: npm run compile-oi-extensions

      - name: Build Linux ARM64 package
        run: npm run gulp vscode-linux-arm64-min
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Archive Linux ARM64
        run: |
          test -d ../VSCode-linux-arm64
          mkdir -p artifacts
          tar -C .. -czf artifacts/ShortestPath-IDE-linux-arm64.tar.gz VSCode-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: artifacts/ShortestPath-IDE-linux-arm64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      # `gh release create` derives the repository from the local Git checkout.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          latest_asset=()
          if [[ "$tag" == Release-v* ]]; then
            version="${tag#Release-v}"
            download_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            manifest_version="$(node -p "require('./latest.json').version")"
            manifest_download_url="$(node -p "require('./latest.json').downloadUrl")"
            if [[ "$manifest_version" != "$version" || "$manifest_download_url" != "$download_url" ]]; then
              echo "latest.json must describe $tag before publishing." >&2
              exit 1
            fi
            latest_asset=(latest.json)
          fi
          # The release body defaults to the bilingual download guide in the repo.
          notes_file="docs/release-notes.md"
          prerelease=()
          if [[ "$tag" == Beta-v* ]]; then
            title="ShortestPath IDE Beta v${tag#Beta-v}"
            prerelease=(--prerelease)
            notes_file="$(mktemp)"
            printf '> **Beta release — preview build for testing.**\n\n' > "$notes_file"
            cat docs/release-notes.md >> "$notes_file"
          else
            title="ShortestPath IDE Release v${tag#Release-v}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* "${latest_asset[@]}" --clobber
            gh release edit "$tag" "${prerelease[@]}" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" release/* "${latest_asset[@]}" "${prerelease[@]}" --title "$title" --notes-file "$notes_file"
          fi
